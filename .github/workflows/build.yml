name: Build C# Solution

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MySolution.sln

      - name: Build
        run: dotnet build MySolution.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish MyProject/MyProject.csproj -c Release -o publish

      - name: Create ZIP
        run: Compress-Archive -Path publish\* -DestinationPath MyProject.zip
        shell: pwsh

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MyProject
          path: MyProject.zip
