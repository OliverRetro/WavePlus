name: Build C# Solution

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Plus.sln

      - name: Check formatting
        run: dotnet format Plus.sln --verify-no-changes --no-restore --verbosity diagnostic

      - name: Build
        run: dotnet build Plus.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Plus.csproj -c Release -o publish --no-restore

      - name: Create ZIP
        run: Compress-Archive -Path publish\* -DestinationPath WavePlus.zip
        shell: pwsh

      - name: Upload ZIP
        uses: actions/upload-artifact@v7
        with:
          name: WavePlus
          path: WavePlus.zip


  deadcode:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install ReSharper CLI
        run: dotnet tool install --global JetBrains.ReSharper.GlobalTools

      - name: Inspect for dead code
        # ReSharper CLI writes SARIF (JSON) regardless of file extension. --no-swea=false
        # keeps solution-wide analysis on, which the *.Global unused rules need.
        # --exclude skips EF entity DTOs (properties read only by EF reflection = false positives).
        run: jb inspectcode Plus.sln --output=inspect.sarif --severity=WARNING --no-swea=false --exclude="WavePlus.Entities/**;Database/EF/**"

      - name: Summarize unused symbols
        shell: pwsh
        run: |
          $results = (Get-Content inspect.sarif -Raw | ConvertFrom-Json).runs[0].results
          $rules = '^(UnusedType|UnusedMember|UnusedMemberInSuper|UnusedMethodReturnValue|NotAccessedField|IDE005[12]|PrivateFieldCanBeConvertedToLocalVariable)'
          $unused = $results | Where-Object { $_.ruleId -match $rules }
          if (-not $unused) {
            Write-Host 'No unused-symbol inspections reported.' -ForegroundColor Green
          } else {
            Write-Host "Potentially dead code ($(@($unused).Count) hits) - review before deleting:" -ForegroundColor Yellow
            $unused | ForEach-Object {
              $p = $_.locations[0].physicalLocation
              '  [{0}] {1}:{2}  {3}' -f $_.ruleId, [Uri]::UnescapeDataString($p.artifactLocation.uri), $p.region.startLine, $_.message.text
            } | Sort-Object
          }

      - name: Upload dead-code report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deadcode-report
          path: inspect.sarif
