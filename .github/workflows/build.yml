name: Build C# Solution

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Plus.sln

      - name: Check formatting
        run: dotnet format Plus.sln --verify-no-changes --no-restore --verbosity diagnostic

      - name: Build
        run: dotnet build Plus.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish Plus.csproj -c Release -o publish --no-restore

      - name: Create ZIP
        run: Compress-Archive -Path publish\* -DestinationPath WavePlus.zip
        shell: pwsh

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: WavePlus
          path: WavePlus.zip
